name: mangatranslate

services:
  mangatranslate:
    build: .
    container_name: mangatranslate
    ports:
      - "${PORT:-1007}:1007"
    environment:
      - PORT=1007
      # Only the deepseek translator needs this. Set TRANSLATOR=debug to run
      # the pipeline without it, which letters every bubble with a fixed string
      # and exercises everything except the translation itself.
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - TRANSLATOR=${TRANSLATOR:-deepseek}
      - TARGET_LANG=${TARGET_LANG:-en}
      # What to assume a chapter is in when the caller does not say. A caller
      # that knows sends it per job and overrides this.
      - SOURCE_LANG=${SOURCE_LANG:-ja}
    volumes:
      # Every model's weights, fetched from the Hugging Face hub the first time
      # each is used -- about 5 GB of them. A volume rather than part of the
      # image so that rebuilding does not download them again.
      - cache:/cache
      # Scratch for the job in flight: a chapter unpacked, lettered and packed
      # again. Anything left here from a previous run is cleared at startup.
      - jobs:/jobs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  cache:
  jobs:

# The same external network Komga and mangaserver are on, so that mangaserver
# reaches this as http://mangatranslate:1007 rather than back out through the
# host's published port.
networks:
  default:
    name: homelab
    external: true
